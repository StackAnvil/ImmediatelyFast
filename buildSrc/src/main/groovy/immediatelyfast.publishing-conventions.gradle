plugins {
    id "me.modmuss50.mod-publish-plugin"
}

publishMods {
    file = tasks.named(project.remap_minecraft ? "remapJar" : "jar").flatMap { it.archiveFile }
    version = project.version + '-' + loom.platform.get().id()
    modLoaders.add(loom.platform.get().id())
    if (project.parent.name == "fabric") {
        modLoaders.add("quilt")
    }

    if (providers.gradleProperty("curseforge.project_id").isPresent()) curseforge {
        accessToken = providers.gradleProperty("curseforge.publishing_token")
        projectId = providers.gradleProperty("curseforge.project_id")
        minecraftVersionList(project.supported_minecraft_versions)
        javaVersions.add(JavaVersion.toVersion(java.toolchain.languageVersion.get().asInt()))
        client = true
        server = false
    }
    if (providers.gradleProperty("modrinth.project_id").isPresent()) modrinth {
        accessToken = providers.gradleProperty("modrinth.publishing_token")
        projectId = providers.gradleProperty("modrinth.project_id")
        minecraftVersionList(project.supported_minecraft_versions)
    }
    github {
        parent project(":common:${project.name}").tasks.named("publishGithub")
    }
}
