plugins {
    id "java-library"
    id "base.base-conventions"
    id "me.modmuss50.mod-publish-plugin"
}

project.pluginManager.apply(project.remap_minecraft ? "dev.architectury.loom-remap" : "dev.architectury.loom-no-remap")

loom {
    mixin {
        useLegacyMixinAp = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (project.remap_minecraft) {
        mappings loom.layered() {
            officialMojangMappings()
            if (project.hasProperty("parchment_mappings")) {
                parchment "org.parchmentmc.data:parchment-${project.parchment_mappings}@zip"
            }
        }
    }
}

repositories {
    maven {
        name = "ParchmentMC"
        url = "https://maven.parchmentmc.org"
        content { includeGroup "org.parchmentmc.data" }
    }
}

def releaseNotes = rootProject.file("CHANGELOG.md").text + "\nUpstream changes:\n" +
        rootProject.file("versions/${project.name}/CHANGELOG.md").text

publishMods {
    type = STABLE
    displayName = rootProject.name + ' ' + project.version.substring(0, project.version.lastIndexOf('+'))
    changelog = releaseNotes
    dryRun = project.maven_version.contains("SNAPSHOT")

    github {
        accessToken = providers.gradleProperty("github.immediatelyfast_publishing_token")
        repository = "StackAnvil/ImmediatelyFast"
        changelog = "**Changelog**\n" + releaseNotes
        commitish = project.git_branch
        tagName = 'v' + project.version
        allowEmptyFiles = true
    }
}
