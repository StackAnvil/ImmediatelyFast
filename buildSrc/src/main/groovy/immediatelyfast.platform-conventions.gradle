plugins {
    id "base.exclude-run-folder"
    id "immediatelyfast.base-conventions"
    id "immediatelyfast.publishing-conventions"
    id "base.include-in-jar-configuration"
}

base {
    archivesName = project.jar_name
}

def commonProject = project(":common:${project.name}")
evaluationDependsOn(commonProject.path)

loom {
    accessWidenerPath = commonProject.loom.accessWidenerPath
    mods {
        "main" {
            sourceSet(commonProject.sourceSets.main)
            sourceSet(project.sourceSets.main)
        }
    }
    runs.configureEach {
        generateRunConfig = true
    }
}

dependencies {
    def commonDependency = project.remap_minecraft ? [path: commonProject.path, configuration: "namedElements"] : [path: commonProject.path]
    implementation project(commonDependency)
    includeInJar(project(commonDependency)) {
        transitive = false
    }
    if (project.parent.name in ["forge", "neoforge"] && project.hasProperty("reflect_version")) {
        forgeRuntimeLibrary "net.lenni0451:Reflect:${project.reflect_version}"
    }
}

jar {
    exclude("assets/immediatelyfast/icon-full.png")
}
