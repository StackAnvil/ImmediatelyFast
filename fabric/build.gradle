plugins {
    id "immediatelyfast.platform-conventions"
}

dependencies {
    add(project.remap_minecraft ? "modImplementation" : "implementation", "net.fabricmc:fabric-loader:${project.fabric_loader_version}")
    if (project.hasProperty("reflect_version")) {
        include "net.lenni0451:Reflect:${project.reflect_version}"
    }
}

processResources {
    inputs.property("version", project.version)

    def projectVersion = project.version
    filesMatching("fabric.mod.json") {
        expand("version": projectVersion)
    }
}
