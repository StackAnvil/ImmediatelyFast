plugins {
    id "immediatelyfast.base-conventions"
}

loom {
    accessWidenerPath = file("src/main/resources/${project.access_file}")
}

dependencies {
    add(project.remap_minecraft ? "modImplementation" : "implementation", "net.fabricmc:fabric-loader:${project.fabric_loader_version}")
    if (project.hasProperty("reflect_version")) {
        api "net.lenni0451:Reflect:${project.reflect_version}"
    }
}
